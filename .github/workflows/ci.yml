name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel superseded runs on the same branch; the badge should reflect HEAD.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.12 is the dev target.
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (black)
        run: black --check --diff .

      - name: Run tests (pytest)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Verify the app boots and serves the UI
        # A green unit-test run does not prove the server actually starts, so
        # boot it for real and hit the two routes the demo depends on.
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8000/ | grep -q "MiniLang"
          curl -sf -X POST http://127.0.0.1:8000/compile \
            -H 'Content-Type: application/json' \
            -d '{"source":"func main(): void {}"}' | grep -q '"parseTrace"'

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
